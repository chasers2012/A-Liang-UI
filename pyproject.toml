[project]
name = "quant-agent"
version = "0.1.0"
description = "Monorepo root: pnpm (apps/web) + uv workspace (apps/api)"
requires-python = ">=3.9"
dependencies = ["quant-agent-api"]

[tool.uv.sources]
quant-agent-api = { workspace = true }
csv-datasource = { workspace = true }
sql-datasource = { workspace = true }
evaluate = { workspace = true }
factor = { workspace = true }
agent = { workspace = true }
workspace = { workspace = true }
custom-code = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "lib/*"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "agent",
    "csv-datasource",
    "sql-datasource",
    "evaluate",
    "factor",
    "workspace",
    "custom-code",
    "psycopg[binary]>=3.1",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
testpaths = ["lib", "apps/api/tests"]
pythonpath = ["apps/api"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "apps/web",
    "node_modules",
]

[tool.ruff.format]
quote-style = "double"
