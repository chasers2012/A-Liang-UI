[project]
name = "quant-agent"
version = "0.1.0"
description = "Monorepo root: pnpm (apps/web) + uv workspace (apps/api)"
requires-python = ">=3.9"
dependencies = ["quant-agent-api"]

[tool.uv.sources]
quant-agent-api = { workspace = true }
csv-datasource = { workspace = true }
sql-datasource = { workspace = true }
evaluate = { workspace = true }
workspace = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "lib/*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "csv-datasource",
    "sql-datasource",
    "evaluate",
    "workspace",
]

[tool.pytest.ini_options]
testpaths = ["lib"]
addopts = ["-ra"]
