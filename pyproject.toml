[project]
name = "quant-agent"
version = "0.1.0"
description = "Monorepo root: pnpm (apps/web) + uv workspace (apps/api)"
requires-python = ">=3.9"
dependencies = ["quant-agent-api"]

[tool.uv.sources]
quant-agent-api = { workspace = true }
csv-datasource = { workspace = true }
sql-datasource = { workspace = true }
evaluate = { workspace = true }
evaluation-metric-templates = { workspace = true }
factor = { workspace = true }
agent = { workspace = true }
workspace = { workspace = true }
custom-code = { workspace = true }
workflow = { workspace = true }
evaluation-workflow-nodes = { workspace = true }
agent-workflow-nodes = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "lib/*"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "agent",
    "csv-datasource",
    "sql-datasource",
    "evaluate",
    "factor",
    "workspace",
    "custom-code",
    "psycopg[binary]>=3.1",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
testpaths = ["lib", "apps/api/tests"]
pythonpath = ["apps/api"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "apps/web",
    "node_modules",
]

[tool.ruff.lint]
# Ruff defaults (E4/E7/E9/F) plus common “recommended” plug-in equivalents.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "C4",
    "I",
    "UP",
    "SIM",
    "RET",
    "PT",
    "RUF",
    "C901",
]
ignore = [
    "E501",   # line length; use formatter / line-length where needed
    "RUF001", # ambiguous Unicode in user-visible strings (e.g. Chinese punctuation)
    "RUF002",
    "RUF003",
    "B008",   # function calls in argument defaults (FastAPI patterns)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
