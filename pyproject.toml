[project]
name = "quant-agent"
version = "0.1.0"
description = "Monorepo root: pnpm (apps/web) + uv workspace (apps/api)"
requires-python = ">=3.9"
dependencies = ["quant-agent-api"]

[tool.uv.sources]
quant-agent-api = { workspace = true }
csv-datasource = { workspace = true }
sql-datasource = { workspace = true }
evaluate = { workspace = true }
factor = { workspace = true }
agent = { workspace = true }
workspace = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "lib/*"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "agent",
    "csv-datasource",
    "sql-datasource",
    "evaluate",
    "factor",
    "workspace",
    "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["lib", "apps/api/tests"]
pythonpath = ["apps/api"]
addopts = ["-ra"]
