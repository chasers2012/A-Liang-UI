[project]
name = "quant-agent"
version = "0.1.0"
description = "Monorepo root: pnpm (apps/web) + uv workspace (apps/api)"
requires-python = ">=3.9"
dependencies = [
    "quant-agent-api",
    "datasource-plugins-builtin",
    "datasource-plugins-baostock",
    "datasource-plugins-tushare",
    "llm-plugins-builtin",
    "embedding-plugins-openai",
    "embedding-plugins-huggingface",
    "rerank-plugins-huggingface",
    "echarts-nodes",
    "common-nodes",
    "strategy-nodes",
    "alphalens-nodes",
    "technical-nodes",
    "example-factors",
    "example-strategies",
    "example-evaluation-profiles",
    "sqlmodel>=0.0.38",
]

[tool.uv.sources]
quant-agent-api = { workspace = true }
datasource-plugins-builtin = { workspace = true }
datasource-plugins-baostock = { workspace = true }
datasource-plugins-tushare = { workspace = true }
llm-plugins-builtin = { workspace = true }
embedding-plugins-openai = { workspace = true }
embedding-plugins-huggingface = { workspace = true }
rerank-plugins-huggingface = { workspace = true }
echarts-nodes = { workspace = true }
common-nodes = { workspace = true }
strategy-nodes = { workspace = true }
alphalens-nodes = { workspace = true }
technical-nodes = { workspace = true }
example-factors = { workspace = true }
example-strategies = { workspace = true }
example-evaluation-profiles = { workspace = true }
data-source = { workspace = true }
factor = { workspace = true }
workspace = { workspace = true }
custom-code = { workspace = true }
workflow = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "lib/*", "plugins/datasource_plugins_builtin", "plugins/datasource_plugins_baostock", "plugins/datasource_plugins_tushare", "plugins/llm_plugins_builtin", "plugins/embedding_plugins_huggingface", "plugins/embedding_plugins_openai", "plugins/rerank_plugins_huggingface", "plugins/echarts_nodes", "plugins/common_nodes", "plugins/strategy_nodes", "plugins/alphalens_nodes", "plugins/technical_nodes", "plugins/example_factors", "plugins/example_strategies", "plugins/example_evaluation_profiles"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "factor",
    "workspace",
    "custom-code",
    "psycopg[binary]>=3.1",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
testpaths = ["lib", "apps/api/tests"]
pythonpath = ["apps/api", "plugins/datasource_plugins_builtin", "plugins/datasource_plugins_baostock", "plugins/datasource_plugins_tushare", "plugins/llm_plugins_builtin"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "apps/web",
    "node_modules",
]

[tool.ruff.lint]
# Ruff defaults (E4/E7/E9/F) plus common “recommended” plug-in equivalents.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "C4",
    "I",
    "UP",
    "SIM",
    "RET",
    "PT",
    "RUF",
    "C901",
]
ignore = [
    "E501",   # line length; use formatter / line-length where needed
    "RUF001", # ambiguous Unicode in user-visible strings (e.g. Chinese punctuation)
    "RUF002",
    "RUF003",
    "B008",   # function calls in argument defaults (FastAPI patterns)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
