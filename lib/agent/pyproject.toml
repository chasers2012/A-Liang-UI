[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.1.0"
description = "LangGraph factor research agent (Ollama + quant-agent factor stack)"
requires-python = ">=3.10"
dependencies = [
    "custom-code",
    "evaluate",
    "factor",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "workspace",
]

[tool.uv.sources]
custom-code = { workspace = true }
evaluate = { workspace = true }
factor = { workspace = true }
workspace = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["agent"]
