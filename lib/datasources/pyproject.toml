[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "datasources"
version = "0.1.0"
description = "CSV and SQL FactorDataSource implementations for the factor package"
requires-python = ">=3.10"
dependencies = [
  "factor",
  "pandas>=2.0.0",
  "sqlalchemy>=2.0.0",
  "workspace",
]

[tool.uv.sources]
factor = { workspace = true }
workspace = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["datasources"]
