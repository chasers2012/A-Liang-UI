[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "datasource-sql"
version = "0.1.0"
description = "SQL-backed FactorDataSource for the factor package"
requires-python = ">=3.10"
dependencies = [
    "factor",
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
]

[tool.uv.sources]
factor = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["datasource_sql"]
