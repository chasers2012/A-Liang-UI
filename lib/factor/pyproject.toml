[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "factor"
version = "0.1.0"
description = "Factor base types and pluggable panel data source"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["factor"]
