[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "csv-datasource"
version = "0.1.0"
description = "CSV-backed FactorDataSource for the factor package"
requires-python = ">=3.10"
dependencies = [
  "factor",
  "pandas>=2.0.0",
  "workspace",
]

[tool.uv.sources]
factor = { workspace = true }
workspace = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["csv_datasource"]
