[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "evaluation-metric-templates"
version = "0.1.0"
description = "Built-in evaluation metric class templates (workflow + evaluate)"
requires-python = ">=3.10"
dependencies = [
    "evaluate",
    "workflow",
]

[tool.uv.sources]
evaluate = { workspace = true }
workflow = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["evaluation_metric_templates"]
