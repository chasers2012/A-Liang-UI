[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "technical-factors"
version = "0.1.0"
description = "Technical indicator factor plugin for quant-agent"
requires-python = ">=3.10"
dependencies = [
    "quant-agent-api",
    "factor",
    "vectorbt",
]

[project.entry-points."quant-agent.plugins"]
technical-factors = "technical_factors.plugin:TechnicalFactorsPlugin"

[tool.uv.sources]
quant-agent-api = { workspace = true }
factor = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["technical_factors"]
