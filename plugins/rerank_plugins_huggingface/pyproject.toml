[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "rerank-plugins-huggingface"
version = "0.1.0"
description = "HuggingFace rerank provider plugin for quant-agent"
requires-python = ">=3.10"
dependencies = [
    "a-liang-ui-api",
    "langchain-community>=0.3.0",
    "langchain-classic>=1.0.3",
    "sentence-transformers>=3.0.0",
]

[project.entry-points."quant-agent.plugins"]
rerank_huggingface = "rerank_plugins_huggingface:HuggingFaceRerankPlugin"

[tool.uv.sources]
a-liang-ui-api = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["rerank_plugins_huggingface"]
