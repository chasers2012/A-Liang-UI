[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "llm-plugins-builtin"
version = "0.1.0"
description = "Built-in quant-agent LLM provider plugins (Ollama, OpenAI)"
requires-python = ">=3.10"
dependencies = [
    "quant-agent-api",
]

[project.entry-points."quant-agent.plugins"]
llm_ollama = "llm_plugins_builtin.ollama:OllamaLlmPlugin"
llm_openai = "llm_plugins_builtin.openai:OpenAiLlmPlugin"

[tool.uv.sources]
quant-agent-api = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["llm_plugins_builtin"]

