[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "datasource-plugins-tushare"
version = "0.1.0"
description = "Tushare datasource plugin for A-Liang-UI"
requires-python = ">=3.10"
dependencies = [
    "a-liang-ui-api",
    "tushare>=1.4.0",
    "tqdm>=4.66.0",
]

[project.entry-points."a-liang-ui.plugins"]
tushare = "datasource_plugins_tushare:TushareDataSourcePlugin"

[tool.uv.sources]
a-liang-ui-api = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["datasource_plugins_tushare"]
