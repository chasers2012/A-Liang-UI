[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "alphalens-nodes"
version = "0.1.0"
description = "Alphalens performance workflow node plugin for quant-agent"
requires-python = ">=3.10"
dependencies = [
    "a-liang-ui-api",
    "workflow",
]

[project.entry-points."quant-agent.plugins"]
alphalens = "alphalens_nodes.plugin:AlphalensNodesPlugin"

[tool.uv.sources]
a-liang-ui-api = { workspace = true }
workflow = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["alphalens_nodes"]
