[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "strategy-nodes"
version = "0.1.0"
description = "Strategy and backtest workflow nodes for A-Liang-UI"
requires-python = ">=3.10"
dependencies = [
    "a-liang-ui-api",
    "factor",
    "workflow",
]

[project.entry-points."a-liang-ui.plugins"]
strategy = "strategy_nodes.plugin:StrategyNodesPlugin"

[tool.uv.sources]
a-liang-ui-api = { workspace = true }
factor = { workspace = true }
workflow = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["strategy_nodes"]
