[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "example-factors"
version = "0.1.0"
description = "Example factor plugin package for A-Liang-UI"
requires-python = ">=3.10"
dependencies = [
    "a-liang-ui-api",
    "factor",
]

[project.entry-points."a-liang-ui.plugins"]
example-factors = "example_factors.plugin:ExampleFactorsPlugin"

[tool.uv.sources]
a-liang-ui-api = { workspace = true }
factor = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["example_factors"]
