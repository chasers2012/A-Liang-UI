[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "example-factors"
version = "0.1.0"
description = "Example factor plugin package for quant-agent"
requires-python = ">=3.10"
dependencies = [
    "quant-agent-api",
    "factor",
]

[project.entry-points."quant-agent.plugins"]
example-factors = "example_factors.plugin:ExampleFactorsPlugin"

[tool.uv.sources]
quant-agent-api = { workspace = true }
factor = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["example_factors"]
