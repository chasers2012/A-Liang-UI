[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "evaluation-nodes"
version = "0.1.0"
description = "Evaluation workflow node plugin for quant-agent"
requires-python = ">=3.10"
dependencies = [
    "quant-agent-api",
    "evaluate",
    "factor",
    "workflow",
]

[project.entry-points."quant-agent.plugins"]
evaluation = "evaluation_nodes.plugin:EvaluationNodesPlugin"

[tool.uv.sources]
quant-agent-api = { workspace = true }
evaluate = { workspace = true }
factor = { workspace = true }
workflow = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["evaluation_nodes"]
