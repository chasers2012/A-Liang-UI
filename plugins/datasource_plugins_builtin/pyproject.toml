[build-system]
requires = ["hatchling>=1.18.0", "duckdb>=1.0.0"]
build-backend = "hatchling.build"

[project]
name = "datasource-plugins-builtin"
version = "0.1.0"
description = "Built-in A-Liang-UI datasource plugins (SQL, CSV)"
requires-python = ">=3.10"
dependencies = [
    "a-liang-ui-api",
    "duckdb>=1.0.0",
]

[project.entry-points."a-liang-ui.plugins"]
csv = "datasource_plugins_builtin.csv:CsvDataSourcePlugin"
sql = "datasource_plugins_builtin.sql:SqlDataSourcePlugin"

[tool.uv.sources]
a-liang-ui-api = { workspace = true }

[dependency-groups]
dev = ["hatchling>=1.18.0"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["datasource_plugins_builtin"]

[tool.hatch.build.targets.wheel.force-include]
"datasource_plugins_builtin/_bundled_extensions" = "datasource_plugins_builtin/_bundled_extensions"
