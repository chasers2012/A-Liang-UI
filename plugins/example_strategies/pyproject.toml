[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "example-strategies"
version = "0.1.0"
description = "Example strategy workflow plugin package for quant-agent"
requires-python = ">=3.10"
dependencies = [
    "quant-agent-api",
]

[project.entry-points."quant-agent.plugins"]
example-strategies = "example_strategies.plugin:ExampleStrategiesPlugin"

[tool.uv.sources]
quant-agent-api = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["example_strategies"]
include = ["example_strategies/workflows/*.json"]
