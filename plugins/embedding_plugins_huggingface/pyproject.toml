[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "embedding-plugins-huggingface"
version = "0.1.0"
description = "HuggingFace embedding provider plugin for A-Liang-UI"
requires-python = ">=3.10"
dependencies = [
    "a-liang-ui-api",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
]

[project.entry-points."a-liang-ui.plugins"]
embedding_huggingface = "embedding_plugins_huggingface:HuggingFaceEmbeddingPlugin"

[tool.uv.sources]
a-liang-ui-api = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["embedding_plugins_huggingface"]
