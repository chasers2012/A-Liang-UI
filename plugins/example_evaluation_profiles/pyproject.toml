[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "example-evaluation-profiles"
version = "0.1.0"
description = "Example evaluation profile plugin package for A-Liang-UI"
requires-python = ">=3.10"
dependencies = [
    "a-liang-ui-api",
]

[project.entry-points."a-liang-ui.plugins"]
example-evaluation-profiles = "example_evaluation_profiles.plugin:ExampleEvaluationProfilesPlugin"

[tool.uv.sources]
a-liang-ui-api = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["example_evaluation_profiles"]
include = ["example_evaluation_profiles/workflows/*.json"]
