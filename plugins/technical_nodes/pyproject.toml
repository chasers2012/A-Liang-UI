[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "technical-nodes"
version = "0.1.0"
description = "Technical indicator workflow node plugin for quant-agent"
requires-python = ">=3.10"
dependencies = [
    "quant-agent-api",
    "workflow",
    "vectorbt",
]

[project.entry-points."quant-agent.plugins"]
technical-nodes = "technical_nodes.plugin:TechnicalNodesPlugin"

[tool.uv.sources]
quant-agent-api = { workspace = true }
workflow = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["technical_nodes"]
