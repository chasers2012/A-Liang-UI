name: Docker

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: |
            quant-agent:${{ github.ref_name }}
            quant-agent:latest
          push: false
          cache-from: type=gha,scope=quant-agent
          cache-to: type=gha,mode=max,scope=quant-agent
