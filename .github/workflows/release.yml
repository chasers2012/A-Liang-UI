name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build portable package
        env:
          CI: 'true'
        run: python scripts/build_standalone.py --clean

      - name: Smoke test portable
        run: |
          chmod +x dist/a-liang-ui_portable/run.sh
          cd dist/a-liang-ui_portable
          ./run.sh &
          pid=$!
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              echo "health ok"
              kill "$pid" || true
              wait "$pid" 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy in time"
          kill "$pid" || true
          wait "$pid" 2>/dev/null || true
          exit 1

      - name: Upload Linux portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-liang-ui-linux-x86_64-portable
          path: dist/a-liang-ui_portable
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build portable package
        env:
          CI: 'true'
        run: python scripts/build_standalone.py --clean

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-liang-ui-windows-x86_64-portable
          path: dist\a-liang-ui_portable
          if-no-files-found: error

  docker:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux portable package
        uses: actions/download-artifact@v4
        with:
          name: a-liang-ui-linux-x86_64-portable
          path: dist/a-liang-ui_portable

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: |
            a-liang-ui:${{ github.ref_name }}
            a-liang-ui:latest
          push: false
          cache-from: type=gha,scope=a-liang-ui
          cache-to: type=gha,mode=max,scope=a-liang-ui
