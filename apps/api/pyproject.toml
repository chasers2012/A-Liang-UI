[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "quant-agent-api"
version = "0.1.0"
description = "quant-agent Python API"
requires-python = ">=3.10"
dependencies = [
  "agent",
  "agent-workflow-nodes",
  "custom-code",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.32.0",
  "sqlmodel>=0.0.24",
  "psycopg[binary]>=3.1.0",
  "pymysql>=1.1.0",
  "workspace",
  "evaluate",
  "factor",
  "datasources",
  "numpy>=1.26.0",
  "croniter>=6.0.0",
  "vectorbt",
  "workflow",
  "langchain-chroma>=0.2.0",
  "langchain-text-splitters>=0.3.0",
  "langchain-huggingface>=0.1.0",
  "sentence-transformers>=3.0.0",
  "chromadb>=0.5.0",
  "unstructured[all-docs]>=0.14.0",
  "unstructured-inference>=0.7.0",
]

[tool.uv.sources]
agent = { workspace = true }
agent-workflow-nodes = { workspace = true }
custom-code = { workspace = true }
workspace = { workspace = true }
evaluate = { workspace = true }
factor = { workspace = true }
datasources = { workspace = true }
workflow = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]
