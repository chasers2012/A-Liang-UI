[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "quant-agent-api"
version = "0.1.0"
description = "quant-agent Python API"
requires-python = ">=3.11"
dependencies = [
  "custom-code",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.32.0",
  "sqlmodel>=0.0.24",
  "psycopg[binary]>=3.1.0",
  "pymysql>=1.1.0",
  "workspace",
  "factor",
  "datasources",
  "pandas>=2.3.0",
  "numpy>=1.26.0",
  "croniter>=6.0.0",
  "vectorbt",
  "workflow",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-ollama>=1.1.0",
  "langchain-chroma>=0.2.0",
  "langchain-text-splitters>=0.3.0",
  "langchain-huggingface>=0.1.0",
  "sentence-transformers>=3.0.0",
  "chromadb>=0.5.0",
  "unstructured[all-docs]>=0.14.0",
  "unstructured-inference>=0.7.0",
  "langchain-classic>=1.0.3",
  "rank-bm25>=0.2.2",
  "deepagents>=0.5.3",
  "langgraph-checkpoint-sqlite>=3.0.3",
  "diskcache>=5.6.3",
]

[tool.uv.sources]
custom-code = { workspace = true }
workspace = { workspace = true }
factor = { workspace = true }
datasources = { workspace = true }
workflow = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]
